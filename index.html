<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لأبويا ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* الصفحة الأولى */
    .page1 {
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #111827, #374151);

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      color: white;
    }

    .box {
      padding: 35px;
    }

    .heart {
      font-size: 70px;
      animation: beat 1.2s infinite;
    }

    h1 {
      font-size: 38px;
    }

    button {
      margin-top: 25px;
      padding: 15px 35px;

      border: none;
      border-radius: 30px;

      background: white;
      color: #111827;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    /* الصفحة الثانية */
    .page2 {
      display: none;

      width: 100%;
      height: 100vh;

      background: linear-gradient(135deg, #1e293b, #0f172a);

      justify-content: center;
      align-items: center;
      text-align: center;

      color: white;
    }

    .message {
      animation: appear 2s ease;
      padding: 25px;
    }

    .message .big-heart {
      font-size: 90px;
      animation: beat 1.2s infinite;
    }

    .message h2 {
      font-size: 36px;
      line-height: 1.7;
    }

    .message p {
      font-size: 23px;
      line-height: 2;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <!-- الصفحة الأولى -->
  <div class="page1" id="page1">

    <div class="box">

      <div class="heart">❤️</div>

      <h1>لأبويا الغالي</h1>

      <p>عندي حاجة عايز أقولهالك...</p>

      <button onclick="openPage()">
        اضغط هنا ❤️
      </button>

    </div>

  </div>


  <!-- الصفحة الثانية -->
  <div class="page2" id="page2">

    <div class="message">

      <div class="big-heart">❤️</div>

      <h2>
        بحبك يا أبويا ❤️
      </h2>

      <p>
        وربنا يخليك لينا دايمًا<br>
        ويديك الصحة والعمر الطويل 🤲❤️
      </p>

    </div>

  </div>


  <script>

    function openPage() {

      // إخفاء الصفحة الأولى
      document.getElementById("page1").style.display = "none";

      // إظهار الصفحة الثانية
      document.getElementById("page2").style.display = "flex";

    }

  </script>

</body>

</html>
